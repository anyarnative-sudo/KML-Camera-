name: Build KML APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o KML_Android_Project.zip
          cd KML_Android_Project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KML-APK
          path: KML_Android_Project/app/build/outputs/apk/debug/app-debug.apk
